name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra app --extra login --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run pyright

      - name: Run pytest
        run: uv run python -m pytest

      - name: Shellcheck
        run: shellcheck src/host/*/*.sh

      - name: Run shell tests
        run: |
          shopt -s nullglob
          tests=(src/host/*/*.test.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "no shell tests in src/host/*/*.test.sh"
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "== $test"
            bash "$test"
          done
