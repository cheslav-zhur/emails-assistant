name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[app,login,dev]"

      - name: Lint
        run: ruff check

      - name: Format
        run: ruff format --check

      - name: Types
        run: pyright

      - name: Run pytest
        run: python -m pytest

      - name: Shellcheck
        run: shellcheck src/host/*/*.sh

      - name: Run shell tests
        run: |
          shopt -s nullglob
          tests=(src/host/*/*.test.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "no shell tests in src/host/*/*.test.sh"
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "== $test"
            bash "$test"
          done
