[project]
name = "emails-assistant"
version = "0.1.0"
description = "Personal Gmail assistant (readonly digest first, expandable later)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-auth==2.62.0",
]

[project.optional-dependencies]
app = [
  "google-api-python-client==2.201.0",
  "google-auth-httplib2==0.4.4",
  "python-dotenv==1.2.4",
  "google-genai==2.31.0",
]
login = [
  "google-auth-oauthlib==1.5.0",
]
dev = [
  "pytest==9.1.1",
  "pyright==1.1.414",
  "ruff==0.17.1",
]

[project.scripts]
emails-assistant = "emails_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "0.13.3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["test_*.py"]
testpaths = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["src"]
include = ["src"]
